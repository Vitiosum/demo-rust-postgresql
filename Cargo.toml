[package]
name = "incident-tracker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "incident-tracker"
path = "src/main.rs"

[dependencies]
axum          = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query"] }
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# TLS (rustls) conservé : sslmode=prefer (défaut sqlx) négocie TLS si l'add-on le propose.
sqlx          = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "derive"] }
serde         = { version = "1", features = ["derive"] }
askama        = { version = "0.12", default-features = false }
uuid          = { version = "1", features = ["serde"] }
chrono        = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "fmt", "ansi", "env-filter"] }
dotenvy       = "0.15"
tower-http    = { version = "0.6", features = ["trace", "set-header"] }

[profile.release]
opt-level = 1
